services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
      - ./web/uploads:/var/www/html/uploads
    environment:
      - DB_HOST=db
      - DB_USER=examprep_user
      - DB_PASS=${DB_PASS}
      - DB_NAME=examprep_db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MOCK_MODE=false
      - AI_BACKEND_URL=http://ai-backend:8000/generate
      - TZ=Europe/London
    depends_on:
      - db
      - ai-backend

  ai-backend:
    build:
      context: ./ai-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
      - TZ=Europe/London

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --default-time-zone=Europe/London
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=examprep_db
      - MYSQL_USER=examprep_user
      - MYSQL_PASSWORD=${DB_PASS}
      - TZ=Europe/London

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=Europe/London
    depends_on:
      - db

volumes:
  db_data: